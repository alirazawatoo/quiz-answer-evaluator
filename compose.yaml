name: goalpost

services:
  api:
    build: ./quiz_app_api
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?copy .env.example to .env and set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./quiz-app-web
      args:
        VITE_API_BASEURL: http://localhost:8000/
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  api-data:
